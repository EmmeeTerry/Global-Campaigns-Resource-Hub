<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Events Calendar | Hitachi Vantara</title>
<style>
:root{--red:#cc0000;--ink:#202124;--muted:#61666e;--line:#e1e3e7;--bg:#f5f6f8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{text-decoration:none;color:inherit}
.shell{max-width:1600px;margin:0 auto;padding:0 22px 26px}
.topbar{background:#fff;border-bottom:3px solid var(--red)}
.topinner{max-width:1600px;padding:12px 22px 11px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.title{min-width:260px}.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:800;color:var(--red);text-transform:uppercase;margin-bottom:5px}
h1{font-size:23px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.45px}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
.links{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:8px 12px;background:#fff;border:1px solid #d9dce1;color:#32343a;font-size:12px;line-height:1.25;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.links a:hover{border-color:var(--red);background:#fff5f5;color:var(--red)}
.links a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0 8px;font-size:12px;color:var(--muted)}
.tip strong{color:#32343a;font-weight:650}
.frame{width:100%;height:calc(100vh - 135px);min-height:680px;border:1px solid var(--line);background:#fff;display:block}
@media(max-width:900px){.topinner{align-items:flex-start}.links{justify-content:flex-start}.frame{height:850px}}
@media(max-width:600px){.shell{padding:0 10px 12px}.topinner{padding:15px 12px}.title{min-width:0}h1{font-size:21px}.links{gap:6px}.links a{font-size:11px;min-height:32px;white-space:normal}.tip{flex-wrap:wrap}.frame{min-height:600px;height:850px}}
</style>
</head>
<body>
<header class="topbar"><div class="topinner">
<div class="title">
<div class="eyebrow">Global Marketing</div>
<h1>Global Events Calendar</h1>
<p class="subtitle">Plan, discover, and activate global and regional events.</p>
</div>
<nav class="links" aria-label="Global campaigns resources">
<a href="https://hitachivantara.sharepoint.com/sites/To-PartnerCommunicationsFY23/SitePages/Content-Library.aspx" target="_blank" rel="noopener noreferrer">Content Library ↗</a>
<a href="https://hitachivantara.sharepoint.com/sites/To-PartnerCommunicationsFY23/SitePages/Webinars-for-Sales-%26-Marketing.aspx" target="_blank" rel="noopener noreferrer">Webinar Activation Resources ↗</a>
</nav></div></header>
<main class="shell">
<div class="tip"><span><strong>Planning a launch or webinar?</strong> Check for scheduling conflicts before confirming your date.</span></div>
<iframe class="frame" title="Hitachi Vantara Global Events Calendar" src="https://apps.powerapps.com/play/e/default-18791e17-6159-4f52-a8d4-de814ca8284a/a/80d68583-19a8-417e-a419-53eb805eae08" allow="fullscreen" loading="eager"></iframe>
</main>
</body></html>
